name: Validazione

on:
  push:
  pull_request:
  schedule:
    # Le regole di HACS e di hassfest cambiano senza che il codice cambi:
    # una passata a settimana dice se qualcosa si e' rotto sotto i piedi.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Niente "ignore": la pagina di HACS sull'inclusione chiede che questa
      # action passi senza errori E senza ignore. Il check "brands" e' gia'
      # soddisfatto dall'icona versionata in custom_components/rifiutologo/brand/,
      # che il validatore cerca in locale prima di rivolgersi a brands.home-assistant.io.
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pytest --cov=custom_components.rifiutologo --cov-report=term-missing
