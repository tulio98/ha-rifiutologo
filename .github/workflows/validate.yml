name: Validazione

on:
  push:
  pull_request:
  schedule:
    # Le regole di HACS e di hassfest cambiano senza che il codice cambi:
    # una passata a settimana dice se qualcosa si e' rotto sotto i piedi.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Finche' il repository e' PRIVATO questo job non puo' passare, e non per
    # colpa nostra: due dei nove check leggono il CONTENUTO dei file da
    # raw.githubusercontent.com senza autenticazione (get_hacs_json_raw chiama
    # async_download_file, che fa session.get senza headers), e li' un repo
    # privato risponde 404. Il download torna vuoto e il check dice "invalid".
    # Provato sul serio il 5 settembre 2026, prima che ci fosse questo `if`:
    # "<Integration tulio98/ha-rifiutologo> 2/9 checks failed", e i due sono
    # hacsjson e integration_manifest. Il job torna da solo appena il repository
    # diventa pubblico. Anche sui giri a cron `github.event.repository` c'e',
    # quindi li' il job risulta "skipped" e non rosso.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v5
      # Niente "ignore": la pagina di HACS sull'inclusione chiede che questa
      # action passi senza errori E senza ignore. Il check "brands" e' gia'
      # soddisfatto dall'icona in custom_components/rifiutologo/brand/icon.png,
      # che il validatore cerca nell'albero del repository prima di rivolgersi a
      # brands.home-assistant.io.
      #
      # Per un'integrazione i check sono NOVE (il decimo, "images", vale solo per
      # plugin e temi), e cinque non guardano i file ma i METADATI su GitHub:
      # description, topics, issues, archived e license. Vanno messi a posto PRIMA
      # del primo push, o la primissima esecuzione nasce rossa senza motivo.
      # Un topic qualsiasi basta: il TOPIC_FILTER di HACS, che scarta i generici
      # come "hacs" o "home-assistant", dentro l'action non si applica
      # (update_data filtra solo se `action` e' falso, e action.py lo mette a
      # True); morde dentro Home Assistant, dove i topic servono a cercare.
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pytest --cov=custom_components.rifiutologo --cov-report=term-missing
