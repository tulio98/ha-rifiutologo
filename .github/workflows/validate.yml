name: Validazione

on:
  push:
  pull_request:
  schedule:
    # Le regole di HACS e di hassfest cambiano senza che il codice cambi:
    # una passata a settimana dice se qualcosa si e' rotto sotto i piedi.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Su un repository PRIVATO questo job non puo' passare, e non per colpa del
    # repository: hacs/action scarica i file da raw.githubusercontent.com SENZA
    # autenticazione (repositories/base.py, get_hacs_json_raw), e li' un repo
    # privato risponde 404. I due check che leggono il CONTENUTO dei file -
    # hacsjson e integration_manifest - falliscono quindi con "invalid" quando in
    # realta' il download e' tornato vuoto. Tutti gli altri sette, che passano
    # dall'API autenticata, sono verdi. Verificato il 5 settembre 2026: 404 su
    # hacs.json, manifest.json e README.md dal raw, e gli stessi file leggibili
    # via API. Il job torna da solo appena il repository diventa pubblico.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v5
      # Niente "ignore": la pagina di HACS sull'inclusione chiede che questa
      # action passi senza errori E senza ignore. Il check "brands" e' gia'
      # soddisfatto dall'icona versionata in custom_components/rifiutologo/brand/,
      # che il validatore cerca in locale prima di rivolgersi a brands.home-assistant.io.
      #
      # Attenzione: 4 dei 10 check leggono i METADATI del repository su GitHub, non
      # i file. Servono una descrizione, le issue abilitate e almeno un topic - e i
      # topic generici non contano: TOPIC_FILTER in hacs/integration scarta fra gli
      # altri "hacs", "home-assistant" e "home-assistant-custom". Qui sopravvivono
      # "italy", "waste-collection" e "rifiuti". Vanno impostati PRIMA del primo
      # push, o la primissima esecuzione nasce rossa senza motivo.
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pytest --cov=custom_components.rifiutologo --cov-report=term-missing
