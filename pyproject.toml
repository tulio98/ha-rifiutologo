[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff
  "D",    # pydocstyle: Home Assistant vuole il docstring ovunque
  "ASYNC",
  "PL",
]
ignore = [
  "D203",  # incompatibile con D211
  "D213",  # incompatibile con D212
  # D401 impone il modo imperativo INGLESE ("Return", non "Returns"). I docstring
  # di questo progetto sono in italiano e la regola non ha modo di valutarli.
  "D401",
]

[tool.ruff.lint.per-file-ignores]
# In un test il valore letterale nell'asserzione E' la specifica: estrarlo in
# una costante allontana il numero dalla cosa che sta verificando.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false
